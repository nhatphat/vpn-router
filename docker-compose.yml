services:
  vpn:
    # The same build context vpnctl embeds; compose is kept only for working
    # on the image by hand.
    build: ./container/context
    restart: always

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - "127.0.0.1:${SOCKS_PORT:-1080}:1080"

    environment:
      TOTP_SECRET: "${TOTP_SECRET}"
      VPN_CONFIG: "/config/company.ovpn"
      VPN_AUTH_FILE: "/config/auth.txt"
      RETRY_DELAY: "${RETRY_DELAY:-5}"

    volumes:
      - ./company.ovpn:/config/company.ovpn:ro
      - ./auth.txt:/config/auth.txt:ro
      # Shared with the host so the DNS router can read the VPN-pushed
      # servers off the filesystem instead of executing anything in the
      # container. Only for running this by hand; vpnctl creates the
      # container itself and mounts the directory beside its config.
      - ./state/run:/run/shared

    # No healthcheck block: it is declared in the Dockerfile now, so it
    # applies however the container is started.
